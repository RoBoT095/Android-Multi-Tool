name: android_multi_tool
description: "A collection of tools and sensor data of your device to see what it is capable of"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: '>=3.38.5 <3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Visuals
  syncfusion_flutter_gauges: ^33.2.5

  # Util helpers
  http: ^1.6.0
  html: ^0.15.6
  
  # Sensors
  sensors_plus: ^7.0.0
  geolocator: ^14.0.2
  light: ^5.0.0

  # Hardware Info
  device_info_plus: ^12.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
