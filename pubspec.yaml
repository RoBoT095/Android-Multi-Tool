name: android_multi_tool
description: "A collection of tools and sensor data of your device to see what it is capable of"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.2.0+2

environment:
  sdk: ^3.11.5
  flutter: '>=3.38.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^12.0.3

  # Visuals
  syncfusion_flutter_gauges: ^35.1.42

  # Util helpers
  http: ^1.6.0
  html: ^0.15.6
  
  # Sensors
  sensors_plus: ^7.0.0
  geolocator: ^14.0.2
  # light: ^5.0.0
  noise_meter: ^6.0.0

  # Hardware Info
  device_info_plus: ^13.3.0
  battery_info:
    git:
      url: https://github.com/RoBoT095/flutter_battery_info
      ref: "89d2b26"
  system_state:
      git:
        url: https://github.com/ShamilPP/system_state
        ref: "7a1318f"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

