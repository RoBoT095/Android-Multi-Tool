name: android_multi_tool
description: "A collection of tools and sensor data of your device to see what it is capable of"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: '>=3.38.5 <3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Sensors
  flutter_compass: ^0.8.1
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

